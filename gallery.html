<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <svg class="sprite" aria-hidden="true" focusable="false">

    <main class="page gallery-page">

            <figure class="photo tape tilt-r">

            <figure class="photo tape tilt-l">
