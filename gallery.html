<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - HEIC Images</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .gallery-header { text-align: center; padding: 3rem 0 1rem 0; }
        .gallery-header h1 { font-size: 2rem; font-weight: 700; color: #1f2937; }
        .gallery-subtitle { color: #6b7280; margin-top: 0.5rem; font-size: 1rem; }
        .gallery-grid { max-width: 1200px; margin: 0 auto; padding: 0 20px 3rem 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; }
        .gallery-card { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; }
        .gallery-card img { width: 100%; height: 240px; object-fit: cover; display: block; }
        .gallery-actions { max-width: 1200px; margin: 0 auto 1rem auto; padding: 0 20px; display: flex; gap: 1rem; }
        .gallery-back { text-decoration: none; color: #8C1515; font-weight: 600; display: inline-flex; align-items: center; gap: 0.5rem; }
        .gallery-back:hover { color: #6B0F0F; }
        @media (max-width: 480px) { .gallery-card img { height: 180px; } }
    </style>
    <script>
        // Warn users if HEIC may not be supported by their browser
        document.addEventListener('DOMContentLoaded', function() {
            var isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
            if (!isSafari) {
                // No UI disruption; optional console note only
                console.log('Some browsers may not natively display HEIC images.');
            }
        });
    </script>
    <link rel="preload" as="image" href="IMG_7458.HEIC">
    <link rel="preload" as="image" href="IMG_7417.HEIC">
    <link rel="preload" as="image" href="IMG_1362.HEIC">
    <link rel="icon" href="1.JPG">
    <meta name="description" content="Gallery of HEIC images">
</head>
<body>
    <div class="gallery-header">
        <h1>Gallery</h1>
        <p class="gallery-subtitle">HEIC images from the portfolio</p>
    </div>
    <div class="gallery-actions">
        <a href="index.html#about" class="gallery-back"><i class="fas fa-arrow-left"></i> Back</a>
    </div>
    <div class="gallery-grid">
        <div class="gallery-card">
            <img src="IMG_7458.HEIC" alt="Gallery image 1">
        </div>
        <div class="gallery-card">
            <img src="IMG_7417.HEIC" alt="Gallery image 2">
        </div>
        <div class="gallery-card">
            <img src="IMG_1362.HEIC" alt="Gallery image 3">
        </div>
    </div>
</body>
</html>
